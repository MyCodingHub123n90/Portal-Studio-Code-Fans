<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"
      integrity="sha512-AA1Bzp5Q0K1KanKKmvN/4d3IRKVlv9PYgwFPvm32nPO6QS8yH1HO7LbgB1pgiOxPtfeg5zEn2ba64MUcqJx6CA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <title>Portal - Studio Code Fans</title>
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    body {
      background-color: black;
      font-family: "Poppins", sans-serif;
      color: white;
    }
    /* ===== AUTH MODAL ===== */
.auth-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.auth-container {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 48px 40px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.auth-form {
    display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.auth-form.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: fadeUp 0.3s ease;
}

.auth-header {
  text-align: center;
  margin-bottom: 32px;
}

.auth-logo {
  font-size: 48px;
  font-weight: 800;
  color: var(--accent);
  background: var(--accent-light);
  width: 72px;
  height: 72px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  margin-bottom: 16px;
}

.auth-header h2 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.auth-header p {
  color: var(--text-secondary);
  font-size: 15px;
}

/* ===== FORM ===== */
.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-weight: 500;
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border-color);
  border-radius: 10px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: "Inter", sans-serif;
  font-size: 15px;
  transition: all 0.2s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-light);
}

.form-group input::placeholder {
  color: var(--text-secondary);
  opacity: 0.6;
}

.auth-error {
  color: #ef4444;
  font-size: 14px;
  margin-top: -8px;
  margin-bottom: 12px;
  min-height: 20px;
  font-weight: 500;
}

.auth-btn {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 10px;
  margin-top: 4px;
}

.auth-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.auth-switch {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
  color: var(--text-secondary);
}

.auth-switch span {
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  transition: color 0.2s;
}

.auth-switch span:hover {
  text-decoration: underline;
}

/* ===== USER PROFILE IN SIDEBAR ===== */
.user-profile {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px;
  border-radius: 10px;
  background: var(--hover-bg);
  margin-bottom: 12px;
  border: 1px solid var(--border-color);
}

.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-email {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .auth-container {
    padding: 32px 24px;
  }

  .auth-logo {
    width: 56px;
    height: 56px;
    font-size: 36px;
  }

  .auth-header h2 {
    font-size: 20px;
  }
}
  </style>
  <body>
    <div id="signupForm" class="auth-form">
          <div class="auth-header">
            <h2>Portal- Studio Code Fans</h2>
            <p>This will send your application to our email</p>
          </div>
          <form id="signupFormElement" onsubmit="" action="formsubmit.co/victornemerem4real@gmail.com">
            <div class="form-group">
              <label>Full Name</label>
              <input
                type="text"
                id="signupName"
                placeholder="Victor Newb"
                required
              />
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input
                type="email"
                id="signupEmail"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label>Username</label>
              <input
                type="text"
                id="signupUsername"
                placeholder="victornewb"
                required
              />
            </div>
            <div id="signupError" class="auth-error"></div>
            <button type="submit" class="btn btn-primary auth-btn">
             <a  style="text-decoration: none;"> Create Account →</a>
            </button>
          </form>
  </body>
  <script>
    const button = document.querySelector("button");
    button.addEventListener("click",function(){
Swal.fire(
  'Success!',
  'Your Data Will be reviewed',
  'success'
)
    });
  </script>
</html>
